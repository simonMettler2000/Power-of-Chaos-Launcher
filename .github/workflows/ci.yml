name: Launcher checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  launcher:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'
      - run: dotnet restore PowerOfChaos.Launcher.sln --locked-mode
      - run: dotnet build PowerOfChaos.Launcher.sln -c Release --no-restore
      - run: dotnet run --project tests/PowerOfChaos.Launcher.Tests -c Release --no-build
      - run: dotnet run --project tests/PowerOfChaos.Launcher.UiChecks -c Release --no-build
      - run: python tools/publication_guard.py --commit HEAD
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
      DOTNET_ADD_GLOBAL_TOOLS_TO_PATH: 'false'
      POC_LAUNCHER_TEST_ROOT: ${{ runner.temp }}/poc-core
